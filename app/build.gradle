plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scanny.scanner'
    // Android 17 (API 37). AGP >= 9.1.1 is required for API 37.
    compileSdk 37

    defaultConfig {
        applicationId "com.templatemela.Scanny"
        // AndroidX, Play services ads 24.x and Material 1.13 require API 23+.
        minSdk 23
        targetSdk 37
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // ARM only. The x86_64 builds of libScanner, OpenCV 3, SmartCropper and TFLite are
            // 4 KB page-aligned, which Google Play rejects for targetSdk 35+ (16 KB requirement).
            // x86/x86_64 are emulator-only; re-add once those libraries ship 16 KB-aligned builds.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['tflite', 'lite']
    }

    packaging {
        jniLibs {
            // Required for 16 KB page-size compatibility: store .so files uncompressed and
            // page-aligned in the APK. (Prebuilt .so files must ALSO be linked with 16 KB
            // ELF alignment - see FABLE_REVIEW.md.)
            useLegacyPackaging = false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(path: ':scanlibrary')
    implementation project(path: ':sticker')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    // Replaces the deprecated androidx.lifecycle:lifecycle-extensions (ProcessLifecycleOwner).
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'com.google.android.material:material:1.13.0'

    // Google Play services
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    // Mobile Vision OCR is deprecated; migrate to ML Kit text recognition (see FABLE_REVIEW.md).
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    // PDF generation. iText 5 is end-of-life and AGPL-licensed - see FABLE_REVIEW.md.
    // Pulled from Maven Central (5.5.13.4) instead of the old checked-in 5.5.13.2 jar.
    implementation 'com.itextpdf:itextpdf:5.5.13.4'
    // Used by iText for PDF encryption. 1.64 had several CVEs (CVE-2020-15522, CVE-2023-33201,
    // CVE-2024-29857, CVE-2024-30171, ...).
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'

    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.otaliastudios:cameraview:2.7.2'
    implementation 'com.airbnb.android:lottie:6.6.7'
    implementation 'com.onesignal:OneSignal:5.1.38'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.edmodo:cropper:1.0.1'
    implementation 'com.burhanrashid52:photoeditor:1.1.1'
    implementation 'jp.wasabeef:richeditor-android:2.0.0'

    // JitPack-only artifacts (repository is restricted to these groups in settings.gradle)
    implementation 'com.github.pqpo:SmartCropper:v2.1.3'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'
    implementation 'com.github.yalantis:ucrop:2.2.10'

    // Removed (unused, unmaintained HTTP stacks): cz.msebera.android:httpclient,
    // com.loopj.android:android-async-http.
    // Removed (JCenter-only, no longer downloadable) and replaced by local code:
    // colorseekbar, signature-view, aspectratio, androidwm-light, drawer-behavior,
    // android-pdf-viewer, nguyenhoanglam ImagePicker.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
