plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scanny.scanner'
    // Android 17 (API 37). AGP >= 9.1.1 is required for API 37.
    compileSdk 37

    defaultConfig {
        applicationId "com.templatemela.Scanny"
        // AndroidX and Material 1.13 require API 23+.
        minSdk 23
        targetSdk 37
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // ARM only. The x86_64 builds of libScanner, OpenCV 3, SmartCropper and TFLite are
            // 4 KB page-aligned, which Google Play rejects for targetSdk 35+ (16 KB requirement).
            // x86/x86_64 are emulator-only; re-add once those libraries ship 16 KB-aligned builds.
            // (The unused x86/x86_64 copies of libScanner/OpenCV were deleted from :scanlibrary.)
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['tflite', 'lite']
    }

    packaging {
        jniLibs {
            // Required for 16 KB page-size compatibility: store .so files uncompressed and
            // page-aligned in the APK. (Prebuilt .so files must ALSO be linked with 16 KB
            // ELF alignment - see FABLE_REVIEW.md.)
            useLegacyPackaging = false
        }
    }

    lint {
        // Release builds run lint (including the security checks) and fail on new errors.
        // Known issues are recorded in lint-baseline.xml; fix them and shrink the baseline.
        checkReleaseBuilds true
        abortOnError true
        baseline = file('lint-baseline.xml')
    }

    testOptions {
        // Plain JVM unit tests (PdfProtectorTest) touch PDFBox code that logs via android.util.Log.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(path: ':scanlibrary')
    implementation project(path: ':sticker')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.google.android.material:material:1.13.0'

    // Google Play services
    // Mobile Vision OCR is deprecated; migrate to ML Kit text recognition (see FABLE_REVIEW.md).
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    // PDF generation. iText 5 is end-of-life and AGPL-licensed - see FABLE_REVIEW.md.
    // Pulled from Maven Central (5.5.13.4) instead of the old checked-in 5.5.13.2 jar.
    implementation 'com.itextpdf:itextpdf:5.5.13.4'
    // PDF password protection. iText 5 can only write AES-256 revision 5, whose single SHA-256
    // password check is cheap to brute-force; PDFBox writes revision 6 (ISO 32000-2).
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // BouncyCastle comes in through pdfbox-android (1.72). 1.78.1 and older have open advisories
    // (CVE-2025-14813, CVE-2026-8763, CVE-2026-0636, CVE-2026-5598, CVE-2026-13506); 1.86 has none.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    constraints {
        implementation('org.bouncycastle:bcpkix-jdk15to18:1.86') { because 'pdfbox-android pulls 1.72' }
        implementation('org.bouncycastle:bcutil-jdk15to18:1.86') { because 'pdfbox-android pulls 1.72' }
    }

    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.otaliastudios:cameraview:2.7.2'
    implementation 'com.airbnb.android:lottie:6.6.7'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.edmodo:cropper:1.0.1'
    implementation 'com.burhanrashid52:photoeditor:1.1.1'
    implementation 'jp.wasabeef:richeditor-android:2.0.0'
    // Sanitizes note HTML before it reaches the RichEditor WebView (NoteSanitizer).
    // 1.23.2 fixes CVE-2026-71497 (Cleaner with a custom Safelist) and CVE-2026-75140.
    implementation 'org.jsoup:jsoup:1.23.2'

    // JitPack-only artifacts (repository is restricted to these groups in settings.gradle)
    implementation 'com.github.pqpo:SmartCropper:v2.1.3'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'
    implementation 'com.github.yalantis:ucrop:2.2.10'

    // Removed: OneSignal. It was never initialised (placeholder app id) but its manifest still
    // added 8 exported receivers/activities and boot, wake-lock and notification permissions.
    // Removed (unused, unmaintained HTTP stacks): cz.msebera.android:httpclient,
    // com.loopj.android:android-async-http.
    // Removed (JCenter-only, no longer downloadable) and replaced by local code:
    // colorseekbar, signature-view, aspectratio, androidwm-light, drawer-behavior,
    // android-pdf-viewer, nguyenhoanglam ImagePicker.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
