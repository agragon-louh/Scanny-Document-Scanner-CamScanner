# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
# Some old third-party libraries (SmartCropper, QuadFlask colorpicker, edmodo cropper,
# roundedimageview) still reference the pre-AndroidX support library.
android.enableJetifier=true
# The Java code uses `switch (view.getId()) { case R.id.x: ... }`, which needs final R fields.
# AGP 9 compiles apps against non-final R classes by default.
android.enableAppCompileTimeRClass=false
android.nonFinalResIds=false
# The app references resources declared in :scanlibrary / :sticker through its own R class.
android.nonTransitiveRClass=false
