plugins {
    id 'com.android.library'
}

android {
    namespace 'com.scanlibrary'
    compileSdk 37

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    // Prebuilt native libraries (OpenCV + libScanner.so). The NDK sources in src/main/jni are
    // not built by Gradle; see FABLE_REVIEW.md about rebuilding them with 16 KB alignment.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}
